[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstone-commands-plus"
version = "1.0.0"
dependencies = ["typing_extensions>=4.16.0"]
authors = [
    { name = "RWRmrfrog", email = "contactrll@gmail.com" },
]
description = "Extra commands for BDS"
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["endstone", "plugin"]
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dev = ["endstone", "ruff"]

[project.urls]
Homepage = "https://github.com/EndstoneMC/python-example-plugin"
Documentation = "https://endstone.dev/latest/"
Changelog = "https://github.com/EndstoneMC/python-example-plugin/blob/main/CHANGELOG.md"
Issues = "https://github.com/EndstoneMC/python-example-plugin/issues"

[project.entry-points."endstone"]
commands-plus = "endstone_commands_plus:CommandsPlus"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["I", "E", "F"]
